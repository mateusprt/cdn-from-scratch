global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets:
        - localhost:9090
        labels:
          app: prometheus

  - job_name: 'cdn-edges'
    scrape_interval: 5s
    static_configs:
      - targets:
          - edge1:8001
        labels:
          role: edge

  - job_name: 'cdn-origin'
    scrape_interval: 5s
    static_configs:
      - targets:
          - origin:4000
        labels:
          role: origin