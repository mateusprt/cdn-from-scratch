
services:
  prometheus:
    image: prom/prometheus:main
    ports:
      - "9090:9090"
    depends_on:
      - router
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
  router:
    image: nginx:latest
    ports:
      - "8080:5000"
    volumes:
      - ./nginx/router.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - scrubber1

  scrubber1:
    build:
      context: .
      dockerfile: cmd/scrubber/Dockerfile
    environment:
      - EDGE_URL=http://edge1:8001
    depends_on:
      - edge1
  edge1:
    build:
      context: .
      dockerfile: cmd/edge/Dockerfile
    environment:
      - ORIGIN_URL=http://origin:4000
    depends_on:
      - origin

  origin:
    build:
      context: .
      dockerfile: cmd/origin/Dockerfile